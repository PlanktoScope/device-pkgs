package:
  description: System administration browser dashboard ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: LGPL-2.1
  sources:
    - https://github.com/cockpit-project/cockpit

host:
  tags:
    - device-portal-name=Cockpit (direct-access fallback)
    - device-portal-description=Provides fallback access to the Cockpit application, accessible even if the system's service proxy stops working
    - device-portal-type=Browser applications
    - device-portal-purpose=System recovery
    - device-portal-entrypoint=/admin/cockpit/
  provides:
    listeners:
      - description: Web server for the Cockpit dashboard
        port: 9090
        protocol: tcp
    services:
      - description: The Cockpit system administration dashboard
        port: 9090
        protocol: http
        paths:
          - /admin/cockpit/*
    filesets:
      - description: Drop-in directory for config file fragments to generate the Cockpit config file
        tags:
          - drop-in-assembly
        paths:
          - /etc/cockpit/cockpit.conf.d
      - description: Drop-in directory to specify origins for Cockpit to allow
        tags:
          - drop-in-assembly
        paths:
          - /etc/cockpit/origins.d

deployment:
  provides:
    file-exports:
      # Config file generation:
      - description: Shell script to generate Cockpit config file from drop-in config fragment files
        source: overlays/usr/libexec/assemble-cockpit-config
        targets:
          - overlays/usr/libexec/assemble-cockpit-config
      - description: systemd service to run the assemble-cockpit-config script during boot
        source: overlays/usr/lib/systemd/system/assemble-cockpit-config.service
        targets:
          - overlays/usr/lib/systemd/system/assemble-cockpit-config.service
      - description: systemd service enablement for assemble-cockpit-config.service
        source: overlays/etc/systemd/system/multi-user.target.wants/assemble-cockpit-config.service
        targets:
          - overlays/etc/systemd/system/multi-user.target.wants/assemble-cockpit-config.service
      # Drop-in config fragments:
      - description: Drop-in Cockpit config fragment with comment describing Cockpit config drop-in directory
        source: overlays/etc/cockpit/cockpit.conf.d/10-header.conf
        targets:
          - overlays/etc/cockpit/cockpit.conf.d/10-header.conf
      - description: Drop-in Cockpit config fragment for the WebService section of the Cockpit config
        source: overlays/etc/cockpit/cockpit.conf.d/20-webservice-0-start.conf
        targets:
          - overlays/etc/cockpit/cockpit.conf.d/20-webservice-0-start.conf
      # Origins config generation:
      - description: Shell script to generate drop-in Cockpit config file fragment from drop-in Cockpit origins fragment files
        source: overlays/usr/libexec/assemble-cockpit-origins
        targets:
          - overlays/usr/libexec/assemble-cockpit-origins
      - description: systemd service to run the assemble-cockpit-origins script during boot
        source: overlays/usr/lib/systemd/system/assemble-cockpit-origins.service
        targets:
          - overlays/usr/lib/systemd/system/assemble-cockpit-origins.service
        # Note: we don't need to enable assemble-cockpit-origins.service because
        # assemble-cockpit-config.service depends on it, and assemble-cockpit-origins.service is
        # useless without assemble-cockpit-config.service.
      # Drop-in origins fragments:
      - description: Drop-in Cockpit origins fragment with comment describing Cockpit origins drop-in directory
        source: overlays/etc/cockpit/origins.d/10-README
        targets:
          - overlays/etc/cockpit/origins.d/10-README
      - description: Drop-in Cockpit origins fragment for access from localhost
        source: overlays/etc/cockpit/origins.d/20-localhost
        targets:
          - overlays/etc/cockpit/origins.d/20-localhost
    filesets:
      - description: Auto-generated Cockpit config file to be overlaid into /etc/cockpit/cockpit.conf
        paths:
          - /run/overlays/generated/etc/cockpit/cockpit.conf
      - description: Auto-generated Cockpit drop-in config fragment file to be overlaid into /etc/cockpit/cockpit.conf.d
        paths:
          - /run/overlays/generated/etc/cockpit/cockpit.conf.d/20-webservice-50-origins.conf

features:
  allow-unencrypted:
    provides:
      file-exports:
        - description: Drop-in Cockpit config fragment to enable connection without HTTPS
          source: overlays/etc/cockpit/cockpit.conf.d/20-webservice-10-allow-unencrypted.conf
          targets:
            - overlays/etc/cockpit/cockpit.conf.d/20-webservice-10-allow-unencrypted.conf
  allow-origins-planktoscope-static-ips:
    provides:
      file-exports:
        - description: Drop-in Cockpit origins fragment for access from some PlanktoScope-assigned static IP addresses
          source: overlays/etc/cockpit/cockpit.conf.d/30-planktoscope-fallback-static-ips
          targets:
            - overlays/etc/cockpit/cockpit.conf.d/30-planktoscope-fallback-static-ips
  allow-origins-planktoscope-legacy-mdns:
    provides:
      file-exports:
        - description: Drop-in Cockpit origins fragment for access from planktoscope.local
          source: overlays/etc/cockpit/cockpit.conf.d/40-planktoscope-legacy-mdns
          targets:
            - overlays/etc/cockpit/cockpit.conf.d/40-planktoscope-legacy-mdns
  allow-origins-planktoscope-names:
    provides:
      file-exports:
        - description: Drop-in Cockpit origins fragment for access from home.pkscope and pkscope.local
          source: overlays/etc/cockpit/cockpit.conf.d/50-planktoscope-names
          targets:
            - overlays/etc/cockpit/cockpit.conf.d/50-planktoscope-names
