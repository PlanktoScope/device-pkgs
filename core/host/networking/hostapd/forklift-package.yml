package:
  description: Wi-Fi access point daemon ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: BSD-3-Clause
  sources:
    - https://w1.fi/hostapd/

deployment:
  provides:
    file-exports:
      - description: Basic config to automatically listen for DNS & DHCP queries
        source: overlays/etc/hostapd/hostapd.conf
        targets:
          - overlays/etc/hostapd/hostapd.conf
