package:
  description: Routing configuration to forward network traffic between interfaces
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: GPL-3.0-or-later
  sources:
    - https://github.com/PlanktoScope/device-pkgs

deployment:
  provides:
    file-exports:
      - description: Kernel parameters to enable routing between network interfaces
        source: overlays/usr/lib/sysctl.d/20-routed-ap.conf
        targets:
          - overlays/usr/lib/sysctl.d/20-routed-ap.conf
      - description: Shell script to set up iptables rules to forward network traffic between interfaces
        source: overlays/usr/libexec/enable-interface-forwarding
        targets:
          - overlays/usr/libexec/enable-interface-forwarding
      - description: systemd service to run the enable-interface-forwarding script during boot
        source: overlays/usr/lib/systemd/system/enable-interface-forwarding.service
        targets:
          - overlays/usr/lib/systemd/system/enable-interface-forwarding.service
      - description: systemd service enablement for enable-interface-forwarding.service
        source: overlays/etc/systemd/system/network-online.target.wants/enable-interface-forwarding.service
        targets:
          - overlays/etc/systemd/system/network-online.target.wants/enable-interface-forwarding.service
