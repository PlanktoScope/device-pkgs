package:
  description: Automatically generates a machine name and uses it to automatically update various other names
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: GPL-3.0-or-later
  sources:
    - https://github.com/PlanktoScope/device-pkgs

host:
  provides:
    filesets:
      - description: Symlink to /run/machine-name, ambiently provided by the OS (for temporary backwards-compatibility with programs expecting /var/lib/planktoscope/machine-name)
        paths:
          - /var/lib/planktoscope/machine-name
      # TODO: move these into feature flags
      - description: File indicating the Wi-Fi SSID name
        paths:
          - /var/lib/planktoscope/hostapd-ssid
      - description: PlanktoScope-specific hosts file for dnsmasq
        paths:
          - /var/lib/planktoscope/hosts

deployment:
  provides:
    file-exports:
      - description: Shell script to generate a machine name based on the Raspberry Pi's serial number
        source: overlays/usr/libexec/update-machine-name
        targets:
          - overlays/usr/libexec/update-machine-name
      - description: systemd service to run the update-machine-name script during boot
        source: overlays/usr/lib/systemd/system/update-machine-name.service
        targets:
          - overlays/usr/lib/systemd/system/update-machine-name.service
      - description: systemd service enablement for update-machine-name.service
        source: overlays/etc/systemd/system/sysinit.target.wants/update-machine-name.service
        targets:
          - overlays/etc/systemd/system/sysinit.target.wants/update-machine-name.service
      - description: Symlink redirecting /etc/hostname to an auto-generated file
        source: overlays/etc/hostname
        targets:
          - overlays/etc/hostname
    filesets:
      - description: Auto-generated file indicating the machine name
        paths:
          - /run/machine-name

features:
  synchronize-hostname:
    description: Updates the hostname to match the machine name
    provides:
      file-exports:
        - description: Shell script to generate a hostname file to be overlaid into /etc/hostname
          source: overlays/usr/libexec/update-hostname
          targets:
            - overlays/usr/libexec/update-hostname
        - description: systemd service to to run the update-hostname script during early boot
          source: overlays/usr/lib/systemd/system/generate-hostname.service
          targets:
            - overlays/usr/lib/systemd/system/generate-hostname.service
        - description: systemd service enablement for generate-hostname.service
          source: overlays/etc/systemd/system/sysinit.target.wants/generate-hostname.service
          targets:
            - overlays/etc/systemd/system/sysinit.target.wants/generate-hostname.service
      filesets:
        - description: Auto-generated file with the hostname to be overlaid into /etc/hostname
          paths:
            - /run/overlays/generated/etc/hostname
  hostname-prefix-pkscope:
    description: "Includes 'pkscope-' as a prefix in the hostname, if it's generated from the machine name"
    provides:
      file-exports:
        - description: "Config file to include 'pkscope-' as a prefix in the hostname"
          source: overlays/etc/hostname-prefix
          targets:
            - overlays/etc/hostname-prefix
  update-cockpit-origins:
    description: Updates Cockpit's allowed origins based on the hostname
    provides:
      file-exports:
        - description: Shell script to generate Cockpit drop-in configurations based on the machine name
          source: overlays/usr/libexec/update-cockpit-origins
          targets:
            - overlays/usr/libexec/update-cockpit-origins
        - description: systemd service to run the update-cockpit-origins script during boot
          source: overlays/usr/lib/systemd/system/planktoscope-org.update-cockpit-origins-machine-name.service
          targets:
            - overlays/usr/lib/systemd/system/planktoscope-org.update-cockpit-origins-machine-name.service
        - description: systemd service enablement for planktoscope-org.update-cockpit-origins-machine-name.service
          source: overlays/etc/systemd/system/multi-user.target.wants/planktoscope-org.update-cockpit-origins-machine-name.service
          targets:
            - overlays/etc/systemd/system/multi-user.target.wants/planktoscope-org.update-cockpit-origins-machine-name.service
      filesets:
        - description: Temporary file indicating the allowed Cockpit origins
          paths:
            - /var/run/planktoscope/cockpit-origins
