package:
  description: Automatically generates a machine name from a hardware serial number
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: GPL-3.0-or-later
  sources:
    - https://github.com/PlanktoScope/device-pkgs

host:
  provides:
    filesets:
      - description:
          Symlink redirecting /var/lib/planktoscope/machine-name to /run/machine-name, ambiently
          provided by the OS (for temporary backwards-compatibility with programs unaware of
          /run/machine-name)
        paths:
          - /var/lib/planktoscope/machine-name
      # TODO: move these into feature flags
      - description: File indicating the Wi-Fi SSID name
        paths:
          - /var/lib/planktoscope/hostapd-ssid
      - description: PlanktoScope-specific hosts file for dnsmasq
        paths:
          - /var/lib/planktoscope/hosts

deployment:
  provides:
    file-exports:
      - description:
          Shell script to generate a machine name based on the Raspberry Pi's serial number
        source: overlays/usr/libexec/generate-machine-name
        targets:
          - overlays/usr/libexec/generate-machine-name
      - description: systemd service to run the generate-machine-name script during boot
        source: overlays/usr/lib/systemd/system/generate-machine-name.service
        targets:
          - overlays/usr/lib/systemd/system/generate-machine-name.service
      - description: systemd service enablement for generate-machine-name.service
        source: overlays/etc/systemd/system/sysinit.target.wants/generate-machine-name.service
        targets:
          - overlays/etc/systemd/system/sysinit.target.wants/generate-machine-name.service
    filesets:
      - description: Auto-generated file indicating the machine name
        paths:
          - /run/machine-name

features:
  generate-hostname-templated:
    description: Updates the hostname from a template which allows inclusion of the machine name
    provides:
      file-exports:
        - description: Shell script to generate a hostname file to be overlaid into /etc/hostname
          source: overlays/usr/libexec/generate-hostname-templated
          targets:
            - overlays/usr/libexec/generate-hostname-templated
        - description:
            systemd service to run the generate-hostname-templated script during early boot
          source: overlays/usr/lib/systemd/system/generate-hostname-templated.service
          targets:
            - overlays/usr/lib/systemd/system/generate-hostname-templated.service
        - description: systemd service enablement for generate-hostname-templated.service
          source: overlays/etc/systemd/system/sysinit.target.wants/generate-hostname-templated.service
          targets:
            - overlays/etc/systemd/system/sysinit.target.wants/generate-hostname-templated.service
        - description: Symlink redirecting /etc/hostname to the auto-generated hostname file
          source: overlays/etc/hostname
          targets:
            - overlays/etc/hostname
        - description:
            systemd service to make systemd-homed.service update the live hostname to match /etc/hostname
          source: overlays/usr/lib/systemd/system/update-hostname.service
          targets:
            - overlays/usr/lib/systemd/system/update-hostname.service
        - description: systemd service enablement for update-hostname.service
          source: overlays/etc/systemd/system/multi-user.target.wants/update-hostname.service
          targets:
            - overlays/etc/systemd/system/multi-user.target.wants/update-hostname.service
      filesets:
        - description: Auto-generated file with the hostname
          paths:
            - /run/overlays/generated/etc/hostname
  hostname-template-pkscope:
    description:
      "Includes 'pkscope-' as a prefix in the hostname, if it's generated from the machine name"
    provides:
      file-exports:
        - description: "Hostname template which includes 'pkscope-' as a prefix in the hostname"
          source: overlays/etc/hostname-template
          targets:
            - overlays/etc/hostname-template
